oke="#e3e6e1" stroke-width="1"></rect><text x="119" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">4</text></g><g><rect x="142" y="118" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="165" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">4.12</text></g><g><rect x="188" y="118" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="211" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">4.47</text></g><g><rect x="234" y="118" width="46" height="46" fill="#c2304a" fill-opacity="0.14" stroke="#e3e6e1" stroke-width="1"></rect><text x="257" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">5</text></g><g><rect x="280" y="118" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="303" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">5.66</text></g><g><rect x="326" y="118" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="349" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">6.40</text></g><g><rect x="96" y="72" width="46" height="46" fill="#c2304a" fill-opacity="0.14" stroke="#e3e6e1" stroke-width="1"></rect><text x="119" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">5</text></g><g><rect x="142" y="72" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="165" y="99" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">5.10</text></g><g><rect x="188" y="72" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="211" y="99" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">5.39</text></g><g><rect x="234" y="72" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="257" y="99" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">5.83</text></g><g><rect x="280" y="72" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="303" y="99" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">6.40</text></g><g><rect x="326" y="72" width="46" height="46" fill="none" fill-opacity="1" stroke="#e3e6e1" stroke-width="1"></rect><text x="349" y="99" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">7.07</text></g><rect x="96" y="72" width="276" height="276" fill="none" stroke="#8a9097" stroke-width="1.25"></rect></g><g data-claude-anchor="axes"><text x="119" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">0</text><text x="165" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">1</text><text x="211" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">2</text><text x="257" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">3</text><text x="303" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">4</text><text x="349" y="366" text-anchor="middle" font-size="11.5" fill="#5d636b">5</text><text x="86" y="329" text-anchor="end" font-size="11.5" fill="#5d636b">0</text><text x="86" y="283" text-anchor="end" font-size="11.5" fill="#5d636b">1</text><text x="86" y="237" text-anchor="end" font-size="11.5" fill="#5d636b">2</text><text x="86" y="191" text-anchor="end" font-size="11.5" fill="#5d636b">3</text><text x="86" y="145" text-anchor="end" font-size="11.5" fill="#5d636b">4</text><text x="86" y="99" text-anchor="end" font-size="11.5" fill="#5d636b">5</text><text data-claude-text-id="axis-dx" x="382" y="366" font-size="11.5" fill="#5d636b">dx</text><text data-claude-text-id="axis-dy" x="86" y="62" text-anchor="end" font-size="11.5" fill="#5d636b">dy</text></g><g data-claude-anchor="legend-cell"><text data-claude-text-id="lg-cell-name" x="420" y="92" font-weight="600" fill="#1f2328">Each cell holds D(δ) = ‖δ‖₂</text><text data-claude-text-id="lg-cell-b1" x="420" y="110" font-size="11.5" fill="#5d636b">for the offset δ = (dx, dy), computed once</text><text data-claude-text-id="lg-cell-b2" x="420" y="128" font-size="11.5" fill="#5d636b">before solving. Shown: dx, dy ≥ 0 for N = 5.</text></g><g data-claude-anchor="legend-full"><text data-claude-text-id="lg-full-name" x="420" y="168" font-weight="600" fill="#1f2328">Full table: (2N + 1)² − 1 = 120 offsets</text><text data-claude-text-id="lg-full-b1" x="420" y="186" font-size="11.5" fill="#5d636b">Signs do not matter: D(±dx, ±dy) = D(dx, dy),</text><text data-claude-text-id="lg-full-b2" x="420" y="204" font-size="11.5" fill="#5d636b">so this quadrant determines every entry.</text></g><g data-claude-anchor="legend-integer"><rect x="420" y="232" width="20" height="20" rx="4" fill="#c2304a" fill-opacity="0.14" stroke="#c2304a" stroke-width="1.25"></rect><text data-claude-text-id="lg-int-name" x="450" y="246" font-weight="600" fill="#1f2328">Integer lengths</text><text data-claude-text-id="lg-int-b1" x="420" y="272" font-size="11.5" fill="#5d636b">Axis offsets, and Pythagorean offsets such as</text><text data-claude-text-id="lg-int-b2" x="420" y="290" font-size="11.5" fill="#5d636b">(3, 4) and (4, 3), whose length is exactly 5.</text></g><g data-claude-anchor="legend-use"><text data-claude-text-id="lg-use-name" x="420" y="330" font-weight="600" fill="#1f2328">How a pair uses it</text><text data-claude-text-id="lg-use-b1" x="420" y="348" font-size="11.5" fill="#5d636b">Leaves at offset (3, 4) are 5 apart, so that pair</text><text data-claude-text-id="lg-use-b2" x="420" y="366" font-size="11.5" fill="#5d636b">allows any scale with m·ℓᵢⱼ ≤ 5.</text></g></svg>
