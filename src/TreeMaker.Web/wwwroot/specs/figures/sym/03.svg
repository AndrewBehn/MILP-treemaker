<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 340" role="img" aria-label="On a 9 by 9 grid the running example reaches m star 1.054, below the diagonal bound 1.273" font-size="13"><rect x="0" y="0" width="760" height="340" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">On a 9 × 9 grid the running example reaches m* = 1.054, below m̄ ≈ 1.273</text><g data-claude-anchor="sheet"><rect x="60" y="64" width="234" height="234" fill="none" stroke="#8a9097" stroke-width="1.25"></rect><g><line x1="86" y1="64" x2="86" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="272" x2="294" y2="272" stroke="#e3e6e1"></line></g><g><line x1="112" y1="64" x2="112" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="246" x2="294" y2="246" stroke="#e3e6e1"></line></g><g><line x1="138" y1="64" x2="138" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="220" x2="294" y2="220" stroke="#e3e6e1"></line></g><g><line x1="164" y1="64" x2="164" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="194" x2="294" y2="194" stroke="#e3e6e1"></line></g><g><line x1="190" y1="64" x2="190" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="168" x2="294" y2="168" stroke="#e3e6e1"></line></g><g><line x1="216" y1="64" x2="216" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="142" x2="294" y2="142" stroke="#e3e6e1"></line></g><g><line x1="242" y1="64" x2="242" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="116" x2="294" y2="116" stroke="#e3e6e1"></line></g><g><line x1="268" y1="64" x2="268" y2="298" stroke="#e3e6e1"></line><line x1="60" y1="90" x2="294" y2="90" stroke="#e3e6e1"></line></g></g><g data-claude-anchor="pairs"><line x1="60" y1="286" x2="60" y2="154" stroke="#8a9097" stroke-width="1.25" stroke-dasharray="none"></line><line x1="72" y1="298" x2="282" y2="298" stroke="#8a9097" stroke-width="1.25" stroke-dasharray="none"></line><line x1="69.98460353205412" y1="148.65640235470275" x2="284.0153964679459" y2="291.3435976452972" stroke="#8a9097" stroke-width="1.25" stroke-dasharray="none"></line><line x1="294" y1="286" x2="294" y2="76" stroke="#8a9097" stroke-width="1.25" stroke-dasharray="none"></line><line x1="68.48528137423857" y1="289.5147186257614" x2="285.5147186257614" y2="72.48528137423857" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="6 4"></line><line x1="71.38419957660616" y1="138.20526680779795" x2="282.6158004233938" y2="67.79473319220206" stroke="#c2304a" stroke-width="3" stroke-dasharray="none"></line></g><g data-claude-anchor="leaves"><circle cx="60" cy="298" r="11" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="60" cy="142" r="11" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="294" cy="298" r="11" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="294" cy="64" r="11" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><text data-claude-text-id="l1" x="60" y="302" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">1</text><text data-claude-text-id="l2" x="60" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">2</text><text data-claude-text-id="l3" x="294" y="302" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">3</text><text data-claude-text-id="l4" x="294" y="68" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">4</text></g><g data-claude-anchor="ratios"><text data-claude-text-id="rt-head" x="360" y="72" font-weight="600" fill="#1f2328">Pair: D(δᵢⱼ) / ℓᵢⱼ</text><text data-claude-text-id="rt-12" x="360" y="98" font-size="12" fill="#5d636b">1–2: 6.00 / 5 = 1.200</text><text data-claude-text-id="rt-13" x="360" y="120" font-size="12" fill="#5d636b">1–3: 9.00 / 8 = 1.125</text><text data-claude-text-id="rt-14" x="360" y="142" font-size="12" fill="#1f2328">1–4: 12.73 / 10 = 1.273 (on the diagonal)</text><text data-claude-text-id="rt-23" x="360" y="164" font-size="12" fill="#5d636b">2–3: 10.82 / 7 = 1.545</text><text data-claude-text-id="rt-24" x="360" y="186" font-size="12" font-weight="600" fill="#1f2328">2–4: 9.49 / 9 = 1.054 (binding)</text><text data-claude-text-id="rt-34" x="360" y="208" font-size="12" fill="#5d636b">3–4: 9.00 / 6 = 1.500</text></g><g data-claude-anchor="legend-binding"><line x1="360" y1="246" x2="384" y2="246" stroke="#c2304a" stroke-width="3"></line><text data-claude-text-id="lg-bind" x="394" y="250" font-size="12" fill="#1f2328">The smallest ratio sets the scale: m* = 1.054</text></g><g data-claude-anchor="legend-diagonal"><line x1="360" y1="274" x2="384" y2="274" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="6 4"></line><text data-claude-text-id="lg-diag" x="394" y="278" font-size="12" fill="#1f2328">No pair can beat the diagonal: m̄ = √2·9 / 10 ≈ 1.273</text></g><text data-claude-text-id="note" x="24" y="326" font-size="11.5" fill="#5d636b">Optimal layout by exhaustive search; the same tree needs N ≥ 9 to reach m = 1.</text></svg>
