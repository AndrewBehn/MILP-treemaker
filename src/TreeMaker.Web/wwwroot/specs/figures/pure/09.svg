<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Shrunken grid optima cluster around the TreeMaker layout as N grows" font-size="13"><rect x="0" y="0" width="760" height="392" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Shrunken grid optima u/N cluster around TreeMaker's layout</text><text data-claude-text-id="subtitle" x="24" y="46" font-size="11.5" fill="#5d636b">Each optimum rotated or reflected to line up with TreeMaker's, all drawn in the unit square</text><g data-claude-anchor="square"><rect x="90" y="96" width="250" height="250" fill="none" stroke="#8a9097" stroke-width="1.25"></rect><g><line x1="152.5" y1="346" x2="152.5" y2="96" stroke="#e3e6e1"></line><line x1="90" y1="283.5" x2="340" y2="283.5" stroke="#e3e6e1"></line></g><g><line x1="215" y1="346" x2="215" y2="96" stroke="#e3e6e1"></line><line x1="90" y1="221" x2="340" y2="221" stroke="#e3e6e1"></line></g><g><line x1="277.5" y1="346" x2="277.5" y2="96" stroke="#e3e6e1"></line><line x1="90" y1="158.5" x2="340" y2="158.5" stroke="#e3e6e1"></line></g><text data-claude-text-id="t0" x="90" y="364" text-anchor="middle" font-size="11.5" fill="#5d636b">0</text><text data-claude-text-id="t1" x="340" y="364" text-anchor="middle" font-size="11.5" fill="#5d636b">1</text></g><g data-claude-anchor="layouts"><circle cx="90" cy="116.625" r="10" fill="none" stroke="#1f2328" stroke-width="2.5"></circle><circle cx="238.475" cy="96" r="10" fill="none" stroke="#1f2328" stroke-width="2.5"></circle><circle cx="160.125" cy="346" r="10" fill="none" stroke="#1f2328" stroke-width="2.5"></circle><circle cx="340" cy="346" r="10" fill="none" stroke="#1f2328" stroke-width="2.5"></circle><polygon points="90,88 83,101 97,101" fill="none" stroke="#1f2328" stroke-width="1.5"></polygon><polygon points="277.5,88 270.5,101 284.5,101" fill="none" stroke="#1f2328" stroke-width="1.5"></polygon><polygon points="152.5,338 145.5,351 159.5,351" fill="none" stroke="#1f2328" stroke-width="1.5"></polygon><polygon points="340,338 333,351 347,351" fill="none" stroke="#1f2328" stroke-width="1.5"></polygon><rect x="85" y="91" width="10" height="10" fill="#1f2328"></rect><rect x="241.25" y="91" width="10" height="10" fill="#1f2328"></rect><rect x="85" y="341" width="10" height="10" fill="#1f2328"></rect><rect x="335" y="341" width="10" height="10" fill="#1f2328"></rect><polygon points="90,89 97,96 90,103 83,96" fill="#c2304a" stroke="#1f2328" stroke-width="1"></polygon><polygon points="246.25,89 253.25,96 246.25,103 239.25,96" fill="#c2304a" stroke="#1f2328" stroke-width="1"></polygon><polygon points="152.5,339 159.5,346 152.5,353 145.5,346" fill="#c2304a" stroke="#1f2328" stroke-width="1"></polygon><polygon points="340,339 347,346 340,353 333,346" fill="#c2304a" stroke="#1f2328" stroke-width="1"></polygon></g><g data-claude-anchor="leaf-labels"><text data-claude-text-id="lv1" x="74" y="120.625" text-anchor="end" font-weight="600" fill="#1f2328">1</text><text data-claude-text-id="lv2" x="238.475" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">2</text><text data-claude-text-id="lv3" x="160.125" y="380" text-anchor="middle" font-weight="600" fill="#1f2328">3</text><text data-claude-text-id="lv4" x="356" y="350" font-weight="600" fill="#1f2328">4</text></g><g data-claude-anchor="legend"><circle cx="432" cy="88" r="8" fill="none" stroke="#1f2328" stroke-width="2.5"></circle><text data-claude-text-id="leg-v" x="450" y="92" fill="#1f2328">TreeMaker optimum v, m_TM = 0.1199</text><polygon points="432,108 425,121 439,121" fill="none" stroke="#1f2328" stroke-width="1.5"></polygon><text data-claude-text-id="leg-4" x="450" y="120" fill="#1f2328">N = 4, m*/N = 0.1145</text><rect x="427" y="137" width="10" height="10" fill="#1f2328"></rect><text data-claude-text-id="leg-8" x="450" y="147" fill="#1f2328">N = 8, m*/N = 0.1187</text><polygon points="432,163 439,170 432,177 425,170" fill="#c2304a" stroke="#1f2328" stroke-width="1"></polygon><text data-claude-text-id="leg-16" x="450" y="174" fill="#1f2328">N = 16, m*/N = 0.1187</text></g><g data-claude-anchor="notes"><text data-claude-text-id="n1" x="424" y="214" font-size="11.5" fill="#5d636b">Leaves 1 and 4 land in the corners every time.</text><text data-claude-text-id="n2" x="424" y="232" font-size="11.5" fill="#5d636b">Leaf 2 moves toward TreeMaker's 0.59 as N grows.</text><text data-claude-text-id="n3" x="424" y="250" font-size="11.5" fill="#5d636b">At N = 8 leaf 3 is not tight, so it can sit anywhere</text><text data-claude-text-id="n4" x="424" y="266" font-size="11.5" fill="#5d636b">far enough away, here the corner.</text><text data-claude-text-id="n5" x="424" y="292" font-size="11.5" fill="#5d636b">So optima need not move steadily toward v; the</text><text data-claude-text-id="n6" x="424" y="308" font-size="11.5" fill="#5d636b">claim is that some subsequence converges to one.</text></g></svg>
