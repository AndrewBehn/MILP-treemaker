<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="Two follow-on stages start from the scale optimum" font-size="13"><rect x="0" y="0" width="760" height="296" fill="#fdfdfb"/><defs><marker id="stage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9097"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Two follow-on stages start from the scale optimum</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#5d636b">Running example on the 9 × 9 grid; both stages keep C:1–C:3 and replace C:4</text><g data-claude-anchor="connectors" fill="none" stroke="#8a9097" stroke-width="1.25"><path d="M264 160H312V112H392" marker-end="url(#stage-arrow)"></path><path d="M312 160V232H392" marker-end="url(#stage-arrow)"></path></g><g data-claude-anchor="stage-scale"><rect x="24" y="124" width="240" height="72" rx="8" fill="#c2304a" fill-opacity="0.12" stroke="#c2304a" stroke-width="2"></rect><text data-claude-text-id="scale-name" x="40" y="148" font-weight="600" fill="#1f2328">Scale optimization</text><text data-claude-text-id="scale-b1" x="40" y="166" font-size="11.5" fill="#5d636b">edge lengths fixed, maximize m</text><text data-claude-text-id="scale-b2" x="40" y="182" font-size="11.5" fill="#5d636b">result: m* = 1.054</text></g><g data-claude-anchor="stage-edge"><rect x="392" y="76" width="344" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9097" stroke-width="1.25"></rect><text data-claude-text-id="edge-name" x="408" y="100" font-weight="600" fill="#1f2328">Edge optimization (11.3)</text><text data-claude-text-id="edge-b1" x="408" y="118" font-size="11.5" fill="#5d636b">fix m₀ = m* and grow the stretch set into spare paper</text><text data-claude-text-id="edge-b2" x="408" y="134" font-size="11.5" fill="#5d636b">result for S = {v–3}: σ* = 0.320</text></g><g data-claude-anchor="stage-strain"><rect x="392" y="196" width="344" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9097" stroke-width="1.25"></rect><text data-claude-text-id="strain-name" x="408" y="220" font-weight="600" fill="#1f2328">Strain optimization (11.4)</text><text data-claude-text-id="strain-b1" x="408" y="238" font-size="11.5" fill="#5d636b">fix a target m₀ above m*, distort edges as little as possible</text><text data-claude-text-id="strain-b2" x="408" y="254" font-size="11.5" fill="#5d636b">result for m₀ = 1.2: total strain 0.281</text></g><text data-claude-text-id="note" x="24" y="284" font-size="11.5" fill="#5d636b">Edge optimization uses leftover paper at m*; strain optimization buys a larger scale with distortion.</text></svg>
