<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 386" role="img" aria-label="Every grid point of the 4 by 4 grid is a grid point of the 8 by 8 grid, so doubling never hurts" font-size="13"><rect x="0" y="0" width="760" height="386" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Every point of the N = 4 grid is a point of the N = 8 grid</text><text data-claude-text-id="subtitle" x="24" y="46" font-size="11.5" fill="#5d636b">The same sheet drawn twice; doubling N halves the spacing and doubles every grid distance</text><text data-claude-text-id="left-title" x="60" y="74" font-weight="600" fill="#1f2328">N = 4: optimum m*₄ = 0.458</text><g data-claude-anchor="coarse"><g><g><line x1="60" y1="326" x2="60" y2="110" stroke="#e3e6e1"></line><line x1="60" y1="326" x2="276" y2="326" stroke="#e3e6e1"></line></g><g><line x1="114" y1="326" x2="114" y2="110" stroke="#e3e6e1"></line><line x1="60" y1="272" x2="276" y2="272" stroke="#e3e6e1"></line></g><g><line x1="168" y1="326" x2="168" y2="110" stroke="#e3e6e1"></line><line x1="60" y1="218" x2="276" y2="218" stroke="#e3e6e1"></line></g><g><line x1="222" y1="326" x2="222" y2="110" stroke="#e3e6e1"></line><line x1="60" y1="164" x2="276" y2="164" stroke="#e3e6e1"></line></g><g><line x1="276" y1="326" x2="276" y2="110" stroke="#e3e6e1"></line><line x1="60" y1="110" x2="276" y2="110" stroke="#e3e6e1"></line></g><rect x="60" y="110" width="216" height="216" fill="none" stroke="#8a9097" stroke-width="1.25"></rect></g><rect x="54" y="104" width="12" height="12" fill="#1f2328"></rect><rect x="216" y="104" width="12" height="12" fill="#1f2328"></rect><rect x="108" y="320" width="12" height="12" fill="#1f2328"></rect><rect x="270" y="320" width="12" height="12" fill="#1f2328"></rect></g><text data-claude-text-id="right-title" x="420" y="74" font-weight="600" fill="#1f2328">N = 8: the same layout, and the new optimum</text><g data-claude-anchor="fine"><g><g><line x1="420" y1="326" x2="420" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="326" x2="636" y2="326" stroke="#e3e6e1"></line></g><g><line x1="447" y1="326" x2="447" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="299" x2="636" y2="299" stroke="#e3e6e1"></line></g><g><line x1="474" y1="326" x2="474" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="272" x2="636" y2="272" stroke="#e3e6e1"></line></g><g><line x1="501" y1="326" x2="501" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="245" x2="636" y2="245" stroke="#e3e6e1"></line></g><g><line x1="528" y1="326" x2="528" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="218" x2="636" y2="218" stroke="#e3e6e1"></line></g><g><line x1="555" y1="326" x2="555" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="191" x2="636" y2="191" stroke="#e3e6e1"></line></g><g><line x1="582" y1="326" x2="582" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="164" x2="636" y2="164" stroke="#e3e6e1"></line></g><g><line x1="609" y1="326" x2="609" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="137" x2="636" y2="137" stroke="#e3e6e1"></line></g><g><line x1="636" y1="326" x2="636" y2="110" stroke="#e3e6e1"></line><line x1="420" y1="110" x2="636" y2="110" stroke="#e3e6e1"></line></g><rect x="420" y="110" width="216" height="216" fill="none" stroke="#8a9097" stroke-width="1.25"></rect></g><rect x="414" y="104" width="12" height="12" fill="#1f2328"></rect><rect x="576" y="104" width="12" height="12" fill="#1f2328"></rect><rect x="468" y="320" width="12" height="12" fill="#1f2328"></rect><rect x="630" y="320" width="12" height="12" fill="#1f2328"></rect><circle cx="420" cy="110" r="11" fill="none" stroke="#c2304a" stroke-width="2.5"></circle><circle cx="555" cy="110" r="11" fill="none" stroke="#c2304a" stroke-width="2.5"></circle><circle cx="420" cy="326" r="11" fill="none" stroke="#c2304a" stroke-width="2.5"></circle><circle cx="636" cy="326" r="11" fill="none" stroke="#c2304a" stroke-width="2.5"></circle></g><g data-claude-anchor="legend"><rect x="60" y="348" width="12" height="12" fill="#1f2328"></rect><text data-claude-text-id="leg-old" x="80" y="358" font-size="11.5" fill="#1f2328">the N = 4 optimum: scale 2 · 0.458 = 0.916 on the finer grid</text><circle cx="486" cy="354" r="8" fill="none" stroke="#c2304a" stroke-width="2.5"></circle><text data-claude-text-id="leg-new" x="500" y="358" font-size="11.5" fill="#1f2328">N = 8 optimum: m*₈ = 0.949</text></g><text data-claude-text-id="note" x="24" y="378" font-size="11.5" fill="#5d636b">The old layout stays feasible at twice the scale, so m*₈ ≥ 2·m*₄; here the finer grid finds a better one.</text></svg>
