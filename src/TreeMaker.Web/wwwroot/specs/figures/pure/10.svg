<svg xmlns="http://www.w3.org/2000/svg" width="760" height="212" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 212" role="img" aria-label="Edge optimization fixes the scale at the optimum; strain optimization picks a target above it" font-size="13"><rect x="0" y="0" width="760" height="212" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">P:1 sits at m* for edge optimization and above it for strain optimization</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#5d636b">Scale axis for the running example on the 9 × 9 grid</text><g data-claude-anchor="band-fits"><rect x="120" y="120" width="201.26000000000022" height="30" fill="#23704a" fill-opacity="0.16"></rect><text data-claude-text-id="fits" x="220.6300000000001" y="139" text-anchor="middle" font-size="11.5" fill="#1f2328">fits unstrained</text></g><g data-claude-anchor="band-strain"><rect x="321.2600000000002" y="120" width="378.7399999999999" height="30" fill="#b7791f" fill-opacity="0.16" stroke="#8a9097" stroke-width="1" stroke-dasharray="4 3"></rect><text data-claude-text-id="needs" x="462.2966666666668" y="139" text-anchor="middle" font-size="11.5" fill="#1f2328">fits only with strain</text></g><g data-claude-anchor="mark-mstar"><line x1="321.2600000000002" y1="104" x2="321.2600000000002" y2="158" stroke="#c2304a" stroke-width="2"></line><text data-claude-text-id="mstar" x="321.2600000000002" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">m* = 1.054</text><text data-claude-text-id="mstar-note" x="321.2600000000002" y="96" text-anchor="middle" font-size="11.5" fill="#5d636b">edge optimization: m₀ = m*</text></g><g data-claude-anchor="mark-target"><line x1="603.3333333333334" y1="104" x2="603.3333333333334" y2="158" stroke="#2f6fa8" stroke-width="2.5" stroke-dasharray="6 3"></line><text data-claude-text-id="target" x="603.3333333333334" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">m₀ = 1.2</text><text data-claude-text-id="target-note" x="603.3333333333334" y="96" text-anchor="middle" font-size="11.5" fill="#5d636b">strain optimization target</text></g><g data-claude-anchor="axis"><line x1="120" y1="158" x2="700.0000000000001" y2="158" stroke="#8a9097" stroke-width="1.25"></line><g><line x1="120" y1="154" x2="120" y2="162" stroke="#8a9097"></line><text x="120" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">0.95</text></g><g><line x1="216.66666666666674" y1="154" x2="216.66666666666674" y2="162" stroke="#8a9097"></line><text x="216.66666666666674" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.00</text></g><g><line x1="313.3333333333335" y1="154" x2="313.3333333333335" y2="162" stroke="#8a9097"></line><text x="313.3333333333335" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.05</text></g><g><line x1="410.0000000000003" y1="154" x2="410.0000000000003" y2="162" stroke="#8a9097"></line><text x="410.0000000000003" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.10</text></g><g><line x1="506.6666666666666" y1="154" x2="506.6666666666666" y2="162" stroke="#8a9097"></line><text x="506.6666666666666" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.15</text></g><g><line x1="603.3333333333334" y1="154" x2="603.3333333333334" y2="162" stroke="#8a9097"></line><text x="603.3333333333334" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.20</text></g><g><line x1="700.0000000000001" y1="154" x2="700.0000000000001" y2="162" stroke="#8a9097"></line><text x="700.0000000000001" y="178" text-anchor="middle" font-size="11.5" fill="#5d636b">1.25</text></g></g><text data-claude-text-id="note" x="24" y="202" font-size="11.5" fill="#5d636b">Below m* the unstrained tree already fits, so strain optimization returns zero strain there.</text></svg>
