<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 366" role="img" aria-label="Shrinking a grid layout by N gives a TreeMaker layout, so the scaled grid optimum cannot beat TreeMaker" font-size="13"><rect x="0" y="0" width="760" height="366" fill="#fdfdfb"/><defs><marker id="ub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9097"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Shrinking a grid layout by N gives a TreeMaker layout at scale m/N</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#5d636b">Running example; the thick line is the tight pair 2–4 in both pictures</text><text data-claude-text-id="left-title" x="48" y="80" font-weight="600" fill="#1f2328">Optimal layout on the 9 × 9 grid</text><g data-claude-anchor="grid-layout"><line x1="48" y1="316" x2="48" y2="100" stroke="#e3e6e1"></line><line x1="72" y1="316" x2="72" y2="100" stroke="#e3e6e1"></line><line x1="96" y1="316" x2="96" y2="100" stroke="#e3e6e1"></line><line x1="120" y1="316" x2="120" y2="100" stroke="#e3e6e1"></line><line x1="144" y1="316" x2="144" y2="100" stroke="#e3e6e1"></line><line x1="168" y1="316" x2="168" y2="100" stroke="#e3e6e1"></line><line x1="192" y1="316" x2="192" y2="100" stroke="#e3e6e1"></line><line x1="216" y1="316" x2="216" y2="100" stroke="#e3e6e1"></line><line x1="240" y1="316" x2="240" y2="100" stroke="#e3e6e1"></line><line x1="264" y1="316" x2="264" y2="100" stroke="#e3e6e1"></line><line x1="48" y1="316" x2="264" y2="316" stroke="#e3e6e1"></line><line x1="48" y1="292" x2="264" y2="292" stroke="#e3e6e1"></line><line x1="48" y1="268" x2="264" y2="268" stroke="#e3e6e1"></line><line x1="48" y1="244" x2="264" y2="244" stroke="#e3e6e1"></line><line x1="48" y1="220" x2="264" y2="220" stroke="#e3e6e1"></line><line x1="48" y1="196" x2="264" y2="196" stroke="#e3e6e1"></line><line x1="48" y1="172" x2="264" y2="172" stroke="#e3e6e1"></line><line x1="48" y1="148" x2="264" y2="148" stroke="#e3e6e1"></line><line x1="48" y1="124" x2="264" y2="124" stroke="#e3e6e1"></line><line x1="48" y1="100" x2="264" y2="100" stroke="#e3e6e1"></line><rect x="48" y="100" width="216" height="216" fill="none" stroke="#8a9097" stroke-width="1.25"></rect><line x1="58.4" y1="168.5" x2="253.6" y2="103.5" stroke="#c2304a" stroke-width="3"></line><circle cx="48" cy="316" r="10" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="48" cy="172" r="10" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="264" cy="316" r="10" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="264" cy="100" r="10" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><text data-claude-text-id="g1" x="48" y="320" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">1</text><text data-claude-text-id="g2" x="48" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">2</text><text data-claude-text-id="g3" x="264" y="320" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">3</text><text data-claude-text-id="g4" x="264" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">4</text></g><text data-claude-text-id="left-cap" x="48" y="346" font-size="11.5" fill="#5d636b">side 9, scale m* = 1.054</text><g data-claude-anchor="shrink"><path d="M300 170H418" fill="none" stroke="#8a9097" stroke-width="1.5" marker-end="url(#ub-arrow)"></path><text data-claude-text-id="shrink-label" x="359" y="160" text-anchor="middle" font-weight="600" fill="#1f2328">divide by N = 9</text><text data-claude-text-id="shrink-note" x="359" y="192" text-anchor="middle" font-size="11.5" fill="#5d636b">every distance shrinks 9×</text></g><text data-claude-text-id="right-title" x="470" y="80" font-weight="600" fill="#1f2328">TreeMaker's unit square</text><g data-claude-anchor="unit-layout"><rect x="470" y="110" width="120" height="120" fill="none" stroke="#8a9097" stroke-width="1.25"></rect><line x1="476.6" y1="147.8" x2="583.4" y2="112.2" stroke="#c2304a" stroke-width="3"></line><circle cx="470" cy="230" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="470" cy="150" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="590" cy="230" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><circle cx="590" cy="110" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#1f2328" stroke-width="1.5"></circle><text data-claude-text-id="u1" x="460" y="234" text-anchor="end" font-size="11.5" fill="#1f2328">1</text><text data-claude-text-id="u2" x="460" y="154" text-anchor="end" font-size="11.5" fill="#1f2328">2</text><text data-claude-text-id="u3" x="600" y="234" font-size="11.5" fill="#1f2328">3</text><text data-claude-text-id="u4" x="600" y="114" font-size="11.5" fill="#1f2328">4</text><text data-claude-text-id="tick0" x="470" y="248" text-anchor="middle" font-size="11.5" fill="#5d636b">0</text><text data-claude-text-id="tick1" x="590" y="248" text-anchor="middle" font-size="11.5" fill="#5d636b">1</text></g><text data-claude-text-id="right-cap1" x="470" y="272" font-size="11.5" fill="#5d636b">side 1, scale m*/N = 1.054 / 9 = 0.117</text><text data-claude-text-id="right-cap2" x="470" y="290" font-size="11.5" fill="#5d636b">a feasible TreeMaker layout, so</text><text data-claude-text-id="right-cap3" x="470" y="308" font-size="11.5" font-weight="600" fill="#1f2328">m*/N ≤ m_TM = 0.1199</text></svg>
