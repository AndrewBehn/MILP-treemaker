<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="Only paths through the stretch set grow; with S equal to v to 3, three pairs gain 2 sigma" font-size="13"><rect x="0" y="0" width="760" height="330" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">Only paths through the stretch set grow: S = {v–3}</text><g data-claude-anchor="edges"><line x1="95.18590677917794" y1="119.66375885947687" x2="178.18873917175048" y2="172.48374310929577" stroke="#8a9097" stroke-width="1.25"></line><line x1="95.18590677917794" y1="240.33624114052313" x2="178.18873917175048" y2="187.51625689070423" stroke="#8a9097" stroke-width="1.25"></line><line x1="204" y1="180" x2="296" y2="180" stroke="#8a9097" stroke-width="1.25"></line><line x1="321.8112608282495" y1="172.48374310929577" x2="404.8140932208221" y2="119.66375885947687" stroke="#2f6fa8" stroke-width="3.5"></line><line x1="321.8112608282495" y1="187.51625689070423" x2="404.8140932208221" y2="240.33624114052313" stroke="#8a9097" stroke-width="1.25"></line></g><g data-claude-anchor="edge-lengths"><text data-claude-text-id="len-1u" x="130" y="134" text-anchor="end" fill="#5d636b">3</text><text data-claude-text-id="len-2u" x="130" y="240" text-anchor="end" fill="#5d636b">2</text><text data-claude-text-id="len-uv" x="250" y="168" text-anchor="middle" fill="#5d636b">3</text><text data-claude-text-id="len-v3" x="350" y="122" text-anchor="end" font-weight="600" fill="#1f2328">2(1 + σ)</text><text data-claude-text-id="len-v4" x="372" y="240" fill="#5d636b">4</text></g><g data-claude-anchor="nodes"><circle cx="80" cy="110" r="18" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><circle cx="80" cy="250" r="18" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><circle cx="190" cy="180" r="14" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><circle cx="310" cy="180" r="14" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><circle cx="420" cy="110" r="18" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><circle cx="420" cy="250" r="18" fill="none" stroke="#8a9097" stroke-width="1.25"></circle><text data-claude-text-id="n1" x="80" y="114" text-anchor="middle" font-weight="600" fill="#1f2328">1</text><text data-claude-text-id="n2" x="80" y="254" text-anchor="middle" font-weight="600" fill="#1f2328">2</text><text data-claude-text-id="nu" x="190" y="184" text-anchor="middle" fill="#1f2328">u</text><text data-claude-text-id="nv" x="310" y="184" text-anchor="middle" fill="#1f2328">v</text><text data-claude-text-id="n3" x="420" y="114" text-anchor="middle" font-weight="600" fill="#1f2328">3</text><text data-claude-text-id="n4" x="420" y="254" text-anchor="middle" font-weight="600" fill="#1f2328">4</text></g><g data-claude-anchor="values"><text data-claude-text-id="val-head" x="496" y="78" font-weight="600" fill="#1f2328">Stretchable lengths sᵢⱼ</text><text data-claude-text-id="val-13" x="496" y="104" font-size="12" font-weight="600" fill="#1f2328">s₁₃ = s₂₃ = s₃₄ = 2</text><text data-claude-text-id="val-13-note" x="496" y="122" font-size="11.5" fill="#5d636b">every path that ends at leaf 3 uses v–3</text><text data-claude-text-id="val-0" x="496" y="150" font-size="12" fill="#1f2328">s₁₂ = s₁₄ = s₂₄ = 0</text><text data-claude-text-id="val-0-note" x="496" y="168" font-size="11.5" fill="#5d636b">these paths avoid the stretch set</text><text data-claude-text-id="res-head" x="496" y="210" font-weight="600" fill="#1f2328">Result on the 9 × 9 grid</text><text data-claude-text-id="res-1" x="496" y="232" font-size="11.5" fill="#5d636b">With m₀ = 1.054 from Section 8, σ* = 0.320:</text><text data-claude-text-id="res-2" x="496" y="250" font-size="11.5" fill="#5d636b">edge v–3 grows from 2 to 2.64, leaf 3 moves</text><text data-claude-text-id="res-3" x="496" y="268" font-size="11.5" fill="#5d636b">from (9, 0) to (9, 2), and pair 3–4 binds.</text></g><text data-claude-text-id="note" x="24" y="314" font-size="11.5" fill="#5d636b">Choosing S = {1–u, v–4} instead gives σ* = 0: edge v–4 lies on the binding path 2–4, so it cannot grow.</text></svg>
