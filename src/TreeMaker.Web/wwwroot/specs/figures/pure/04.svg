<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Rounding TreeMaker layout to the nearest grid points moves each leaf at most half a grid diagonal" font-size="13"><rect x="0" y="0" width="760" height="392" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Rounding TreeMaker's layout moves each leaf at most half a diagonal</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#5d636b">TreeMaker's optimum scaled to the 9 × 9 sheet; dashed circles have radius √2/2</text><g data-claude-anchor="sheet"><line x1="56" y1="338" x2="56" y2="86" stroke="#e3e6e1"></line><line x1="84" y1="338" x2="84" y2="86" stroke="#e3e6e1"></line><line x1="112" y1="338" x2="112" y2="86" stroke="#e3e6e1"></line><line x1="140" y1="338" x2="140" y2="86" stroke="#e3e6e1"></line><line x1="168" y1="338" x2="168" y2="86" stroke="#e3e6e1"></line><line x1="196" y1="338" x2="196" y2="86" stroke="#e3e6e1"></line><line x1="224" y1="338" x2="224" y2="86" stroke="#e3e6e1"></line><line x1="252" y1="338" x2="252" y2="86" stroke="#e3e6e1"></line><line x1="280" y1="338" x2="280" y2="86" stroke="#e3e6e1"></line><line x1="308" y1="338" x2="308" y2="86" stroke="#e3e6e1"></line><line x1="56" y1="338" x2="308" y2="338" stroke="#e3e6e1"></line><line x1="56" y1="310" x2="308" y2="310" stroke="#e3e6e1"></line><line x1="56" y1="282" x2="308" y2="282" stroke="#e3e6e1"></line><line x1="56" y1="254" x2="308" y2="254" stroke="#e3e6e1"></line><line x1="56" y1="226" x2="308" y2="226" stroke="#e3e6e1"></line><line x1="56" y1="198" x2="308" y2="198" stroke="#e3e6e1"></line><line x1="56" y1="170" x2="308" y2="170" stroke="#e3e6e1"></line><line x1="56" y1="142" x2="308" y2="142" stroke="#e3e6e1"></line><line x1="56" y1="114" x2="308" y2="114" stroke="#e3e6e1"></line><line x1="56" y1="86" x2="308" y2="86" stroke="#e3e6e1"></line><rect x="56" y="86" width="252" height="252" fill="none" stroke="#8a9097" stroke-width="1.25"></rect></g><g data-claude-anchor="rounding"><g><circle cx="56" cy="106.78999999999999" r="19.79898987322333" fill="none" stroke="#5d636b" stroke-width="1" stroke-dasharray="3 3"></circle><line x1="56" y1="106.78999999999999" x2="56" y2="114" stroke="#1f2328" stroke-width="1.5"></line><rect x="51" y="109" width="10" height="10" fill="#1f2328"></rect><circle cx="56" cy="106.78999999999999" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#c2304a" stroke-width="2.5"></circle></g><g><circle cx="205.6628" cy="86" r="19.79898987322333" fill="none" stroke="#5d636b" stroke-width="1" stroke-dasharray="3 3"></circle><line x1="205.6628" y1="86" x2="196" y2="86" stroke="#1f2328" stroke-width="1.5"></line><rect x="191" y="81" width="10" height="10" fill="#1f2328"></rect><circle cx="205.6628" cy="86" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#c2304a" stroke-width="2.5"></circle></g><g><circle cx="126.686" cy="338" r="19.79898987322333" fill="none" stroke="#5d636b" stroke-width="1" stroke-dasharray="3 3"></circle><line x1="126.686" y1="338" x2="140" y2="338" stroke="#1f2328" stroke-width="1.5"></line><rect x="135" y="333" width="10" height="10" fill="#1f2328"></rect><circle cx="126.686" cy="338" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#c2304a" stroke-width="2.5"></circle></g><g><circle cx="308" cy="338" r="19.79898987322333" fill="none" stroke="#5d636b" stroke-width="1" stroke-dasharray="3 3"></circle><line x1="308" y1="338" x2="308" y2="338" stroke="#1f2328" stroke-width="1.5"></line><rect x="303" y="333" width="10" height="10" fill="#1f2328"></rect><circle cx="308" cy="338" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#c2304a" stroke-width="2.5"></circle></g></g><g data-claude-anchor="labels"><text data-claude-text-id="r1" x="70" y="128.72" font-size="11.5" font-weight="600" fill="#1f2328">1</text><text data-claude-text-id="r2" x="217.79999999999998" y="106" font-size="11.5" font-weight="600" fill="#1f2328">2</text><text data-claude-text-id="r3" x="120.56" y="322" text-anchor="end" font-size="11.5" font-weight="600" fill="#1f2328">3</text><text data-claude-text-id="r4" x="294" y="322" text-anchor="end" font-size="11.5" font-weight="600" fill="#1f2328">4</text></g><g data-claude-anchor="legend"><circle cx="396" cy="88" r="6" fill="rgba(107, 113, 120, 0.10)" stroke="#c2304a" stroke-width="2.5"></circle><text data-claude-text-id="leg-c" x="412" y="92" fill="#1f2328">TreeMaker position, scaled: N·vᵢ</text><rect x="391" y="111" width="10" height="10" fill="#1f2328"></rect><text data-claude-text-id="leg-g" x="412" y="120" fill="#1f2328">nearest grid point uᵢ</text></g><g data-claude-anchor="moves"><text data-claude-text-id="mv-head" x="396" y="160" font-weight="600" fill="#1f2328">Distance moved</text><text data-claude-text-id="mv-1" x="396" y="180" font-size="11.5" fill="#5d636b">leaf 1: 0.26, leaf 2: 0.35, leaf 3: 0.48, leaf 4: 0</text><text data-claude-text-id="mv-2" x="396" y="196" font-size="11.5" fill="#5d636b">each at most √2/2 ≈ 0.71, so a pair loses at most √2</text></g><g data-claude-anchor="scales"><text data-claude-text-id="sc-head" x="396" y="236" font-weight="600" fill="#1f2328">Scales on the 9 × 9 sheet</text><text data-claude-text-id="sc-1" x="396" y="256" font-size="11.5" fill="#5d636b">TreeMaker scaled up: N·m_TM = 1.079</text><text data-claude-text-id="sc-2" x="396" y="272" font-size="11.5" fill="#5d636b">grid optimum: m* = 1.054</text><text data-claude-text-id="sc-3" x="396" y="288" font-size="11.5" fill="#5d636b">rounded layout: 1.000</text><text data-claude-text-id="sc-4" x="396" y="304" font-size="11.5" fill="#5d636b">guaranteed: N·m_TM − √2/ℓ_min = 0.796</text></g><text data-claude-text-id="note" x="24" y="380" font-size="11.5" fill="#5d636b">The guarantee is loose here: rounding keeps scale 1.000, well above the worst case.</text></svg>
