<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 340" role="img" aria-label="Doubling the grid quadruples the selectors per pair and halves the worst-case loss" font-size="13"><rect x="0" y="0" width="760" height="340" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Doubling N quadruples the selectors per pair and halves the worst-case loss</text><text data-claude-text-id="subtitle" x="24" y="46" font-size="11.5" fill="#5d636b">Running example, ℓ_min = 5, m_TM = 0.1199</text><text data-claude-text-id="a-title" x="40" y="86" font-weight="600" fill="#1f2328">Selectors per pair, (2N + 1)² − 1</text><text data-claude-text-id="b-title" x="410" y="86" font-weight="600" fill="#1f2328">Relative loss against m_TM</text><g data-claude-anchor="panel-a"><line x1="110" y1="100" x2="110" y2="268" stroke="#8a9097" stroke-width="1.25"></line><g><rect x="110" y="110" width="4.356060606060609" height="16" fill="#1f2328" fill-opacity="0.55"></rect><text x="122.35606060606061" y="122" font-size="11.5" fill="#1f2328">80</text></g><g><rect x="110" y="154" width="15.681818181818187" height="16" fill="#1f2328" fill-opacity="0.55"></rect><text x="133.6818181818182" y="166" font-size="11.5" fill="#1f2328">288</text></g><g><rect x="110" y="198" width="59.24242424242425" height="16" fill="#1f2328" fill-opacity="0.55"></rect><text x="177.24242424242425" y="210" font-size="11.5" fill="#1f2328">1,088</text></g><g><rect x="110" y="242" width="230" height="16" fill="#1f2328" fill-opacity="0.55"></rect><text x="348" y="254" font-size="11.5" fill="#1f2328">4,224</text></g></g><g data-claude-anchor="panel-b"><line x1="480" y1="100" x2="480" y2="268" stroke="#8a9097" stroke-width="1.25"></line><g><rect x="480" y="106" width="226.16666666666663" height="10" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="4 2"></rect><text x="714.1666666666666" y="115" font-size="11.5" fill="#5d636b">59.0%</text></g><g><rect x="480" y="150" width="113.08333333333337" height="10" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="4 2"></rect><text x="601.0833333333334" y="159" font-size="11.5" fill="#5d636b">29.5%</text></g><g><rect x="480" y="194" width="56.35000000000002" height="10" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="4 2"></rect><text x="544.35" y="203" font-size="11.5" fill="#5d636b">14.7%</text></g><g><rect x="480" y="238" width="28.366666666666674" height="10" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="4 2"></rect><text x="516.3666666666667" y="247" font-size="11.5" fill="#5d636b">7.4%</text></g><g><rect x="480" y="120" width="17.25" height="10" fill="#c2304a" stroke="#1f2328" stroke-width="1"></rect><text x="505.25" y="129" font-size="11.5" font-weight="600" fill="#1f2328">4.5%</text></g><g><rect x="480" y="164" width="4.024999999999977" height="10" fill="#c2304a" stroke="#1f2328" stroke-width="1"></rect><text x="492.025" y="173" font-size="11.5" font-weight="600" fill="#1f2328">1.1%</text></g><g><rect x="480" y="208" width="4.024999999999977" height="10" fill="#c2304a" stroke="#1f2328" stroke-width="1"></rect><text x="492.025" y="217" font-size="11.5" font-weight="600" fill="#1f2328">1.1%</text></g></g><g data-claude-anchor="n-labels"><text data-claude-text-id="na4" x="40" y="122" fill="#1f2328">N = 4</text><text data-claude-text-id="na8" x="40" y="166" fill="#1f2328">N = 8</text><text data-claude-text-id="na16" x="40" y="210" fill="#1f2328">N = 16</text><text data-claude-text-id="na32" x="40" y="254" fill="#1f2328">N = 32</text><text data-claude-text-id="nb4" x="410" y="122" fill="#1f2328">N = 4</text><text data-claude-text-id="nb8" x="410" y="166" fill="#1f2328">N = 8</text><text data-claude-text-id="nb16" x="410" y="210" fill="#1f2328">N = 16</text><text data-claude-text-id="nb32" x="410" y="254" fill="#1f2328">N = 32</text><text data-claude-text-id="nb32-act" x="486" y="261" font-size="11.5" fill="#5d636b">not solved</text></g><g data-claude-anchor="legend"><rect x="410" y="286" width="22" height="10" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="4 2"></rect><text data-claude-text-id="leg-bound" x="440" y="295" font-size="11.5" fill="#1f2328">guaranteed at most: √2 / (N·m_TM·ℓ_min)</text><rect x="410" y="306" width="22" height="10" fill="#c2304a" stroke="#1f2328" stroke-width="1"></rect><text data-claude-text-id="leg-act" x="440" y="315" font-size="11.5" fill="#1f2328">actual: (m_TM − m*_N/N) / m_TM</text></g><text data-claude-text-id="note" x="24" y="334" font-size="11.5" fill="#5d636b">The guarantee is loose: the actual loss is already about 1% at N = 8.</text></svg>
