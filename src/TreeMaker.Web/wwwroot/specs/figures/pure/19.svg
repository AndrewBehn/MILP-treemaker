<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Two linear rows make a at least the absolute strain, and minimizing presses a onto the V" font-size="13"><rect x="0" y="0" width="760" height="320" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Two linear rows make aₑ at least |σₑ|; minimizing presses aₑ onto the V</text><g data-claude-anchor="feasible"><polygon points="80,90 260,270 440,90" fill="rgba(107, 113, 120, 0.10)"></polygon></g><g data-claude-anchor="frame"><line x1="80" y1="270" x2="440" y2="270" stroke="#8a9097" stroke-width="1.25"></line><line x1="260" y1="270" x2="260" y2="71.99999999999997" stroke="#e3e6e1"></line><g><line x1="80" y1="266" x2="80" y2="274" stroke="#8a9097"></line><text x="80" y="290" text-anchor="middle" font-size="11.5" fill="#5d636b">−0.50</text></g><g><line x1="170" y1="266" x2="170" y2="274" stroke="#8a9097"></line><text x="170" y="290" text-anchor="middle" font-size="11.5" fill="#5d636b">−0.25</text></g><g><line x1="260" y1="266" x2="260" y2="274" stroke="#8a9097"></line><text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#5d636b">0.00</text></g><g><line x1="350" y1="266" x2="350" y2="274" stroke="#8a9097"></line><text x="350" y="290" text-anchor="middle" font-size="11.5" fill="#5d636b">0.25</text></g><g><line x1="440" y1="266" x2="440" y2="274" stroke="#8a9097"></line><text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#5d636b">0.50</text></g><text data-claude-text-id="axis-s" x="452" y="274" font-size="11.5" fill="#5d636b">σₑ</text><text data-claude-text-id="axis-a" x="268" y="75.99999999999997" font-size="11.5" fill="#5d636b">aₑ</text></g><g data-claude-anchor="row-plus"><line x1="260" y1="270" x2="440" y2="90" stroke="#c2304a" stroke-width="2"></line></g><g data-claude-anchor="row-minus"><line x1="260" y1="270" x2="80" y2="90" stroke="#2f6fa8" stroke-width="2.5" stroke-dasharray="7 4"></line></g><g data-claude-anchor="points"><circle cx="170" cy="126" r="5" fill="none" stroke="#5d636b" stroke-width="1.5"></circle><text data-claude-text-id="pt-loose" x="180" y="130" font-size="11.5" fill="#5d636b">a = 0.40: allowed, not minimal</text><circle cx="170" cy="180" r="6" fill="#b3261e"></circle><text data-claude-text-id="pt-min" x="158" y="184" text-anchor="end" font-size="11.5" font-weight="600" fill="#1f2328">v–4: a = |−0.25|</text></g><g data-claude-anchor="legend-plus"><line x1="520" y1="92" x2="544" y2="92" stroke="#c2304a" stroke-width="2"></line><text data-claude-text-id="leg-plus" x="552" y="96" font-size="11.5" fill="#1f2328">row aₑ ≥ σₑ (solid)</text></g><g data-claude-anchor="legend-minus"><line x1="520" y1="120" x2="544" y2="120" stroke="#2f6fa8" stroke-width="2.5" stroke-dasharray="7 4"></line><text data-claude-text-id="leg-minus" x="552" y="124" font-size="11.5" fill="#1f2328">row aₑ ≥ −σₑ (dashed)</text></g><g data-claude-anchor="legend-region"><rect x="520" y="140" width="24" height="14" fill="rgba(107, 113, 120, 0.10)"></rect><text data-claude-text-id="leg-region" x="552" y="152" font-size="11.5" fill="#1f2328">both rows hold</text></g><text data-claude-text-id="leg-note1" x="520" y="190" font-size="11.5" fill="#5d636b">The objective lowers each aₑ until</text><text data-claude-text-id="leg-note2" x="520" y="206" font-size="11.5" fill="#5d636b">one row is tight, so aₑ = |σₑ| at</text><text data-claude-text-id="leg-note3" x="520" y="222" font-size="11.5" fill="#5d636b">the optimum without an absolute</text><text data-claude-text-id="leg-note4" x="520" y="238" font-size="11.5" fill="#5d636b">value in the model.</text></svg>
