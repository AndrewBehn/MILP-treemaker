92" r="5" fill="#b3261e"></circle><text data-claude-text-id="leg-m-name" x="412" y="196" font-weight="600" fill="#1f2328">(4, 2): too short, √20 &lt; 5</text><text data-claude-text-id="leg-m-body" x="412" y="214" font-size="11.5" fill="#5d636b">outside conv Q, so a restricted model allows it</text></g><g data-claude-anchor="legend-added"><circle cx="396" cy="246" r="5" fill="none" stroke="#b3261e" stroke-width="1.5"></circle><text data-claude-text-id="leg-a-name" x="412" y="250" font-weight="600" fill="#1f2328">The check adds (4, 2) and 7 images</text><text data-claude-text-id="leg-a-body" x="412" y="268" font-size="11.5" fill="#5d636b">which here restores the full hull</text></g><text data-claude-text-id="note" x="24" y="326" font-size="11.5" fill="#5d636b">Every point added is a forbidden offset, so an inner polygon never grows past its full hull.</text></svg>
