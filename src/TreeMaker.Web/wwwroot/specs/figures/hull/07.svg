<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="Archivo, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 340" role="img" aria-label="M ijk lifts a switched-off facet row below the smallest possible inner product" font-size="13"><rect x="0" y="0" width="760" height="340" fill="#fdfdfb"/><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Mᵢⱼₖ puts a switched-off facet row below the smallest possible aₖᵀδ</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#5d636b">Example: diagonal facet aₖ = (1, 1), bₖ = 6 at radius 5, full windows on a grid with N = 12</text><g data-claude-anchor="guides"><line x1="96" y1="96" x2="96" y2="250" stroke="#e3e6e1" stroke-dasharray="3 3"></line><line x1="396" y1="96" x2="396" y2="250" stroke="#e3e6e1" stroke-dasharray="3 3"></line><line x1="696" y1="96" x2="696" y2="250" stroke="#e3e6e1" stroke-dasharray="3 3"></line></g><g data-claude-anchor="range"><rect x="96" y="117" width="600" height="14" rx="7" fill="#c2304a" fill-opacity="0.18" stroke="#c2304a" stroke-width="1.5"></rect><text data-claude-text-id="range-name" x="88" y="128" text-anchor="end" font-weight="600" fill="#1f2328">aₖᵀδ</text><text data-claude-text-id="range-note" x="296" y="104" text-anchor="middle" font-size="11.5" fill="#5d636b">every value the offset can produce on the sheet</text></g><g data-claude-anchor="threshold"><line x1="483.5" y1="92" x2="483.5" y2="250" stroke="#2f6fa8" stroke-width="2"></line><text data-claude-text-id="threshold-label" x="491.5" y="160" font-weight="600" fill="#1f2328">bₖ + 1 = 7</text><text data-claude-text-id="threshold-note" x="491.5" y="178" font-size="11.5" fill="#5d636b">threshold when z = 1</text></g><g data-claude-anchor="bracket"><path d="M96 194V204H483.5V194" fill="none" stroke="#1f2328" stroke-width="1.5"></path><text data-claude-text-id="bracket-label" x="289.75" y="226" text-anchor="middle" font-weight="600" fill="#1f2328">M = bₖ + 1 + ‖aₖ‖₁·N = 31</text></g><g data-claude-anchor="axis"><line x1="96" y1="256" x2="696" y2="256" stroke="#8a9097" stroke-width="1.25"></line><line x1="96" y1="250" x2="96" y2="262" stroke="#8a9097" stroke-width="1.25"></line><line x1="396" y1="250" x2="396" y2="262" stroke="#8a9097" stroke-width="1.25"></line><line x1="483.5" y1="250" x2="483.5" y2="262" stroke="#8a9097" stroke-width="1.25"></line><line x1="696" y1="250" x2="696" y2="262" stroke="#8a9097" stroke-width="1.25"></line><text data-claude-text-id="t-min" x="96" y="278" text-anchor="middle" font-size="11.5" fill="#5d636b">−‖aₖ‖₁N</text><text data-claude-text-id="t-zero" x="396" y="278" text-anchor="middle" font-size="11.5" fill="#5d636b">0</text><text data-claude-text-id="t-thr" x="483.5" y="278" text-anchor="middle" font-size="11.5" fill="#5d636b">bₖ + 1</text><text data-claude-text-id="t-max" x="696" y="278" text-anchor="middle" font-size="11.5" fill="#5d636b">‖aₖ‖₁N</text></g><text data-claude-text-id="note1" x="24" y="306" font-size="11.5" fill="#5d636b">Each coordinate of δ lies in [−N, N], so aₖᵀδ lies in [−‖aₖ‖₁N, ‖aₖ‖₁N] = [−24, 24] here.</text><text data-claude-text-id="note2" x="24" y="324" font-size="11.5" fill="#5d636b">With z = 0 the row reads aₖᵀδ ≥ bₖ + 1 − M, which must hold even at the minimum, −24.</text></svg>
